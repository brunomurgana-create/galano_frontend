<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251f">
  <title>Galano Muebles | Administración</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" data-view="dashboard" aria-label="Galano Muebles, inicio">
      <span class="brand-mark">G</span>
      <span class="brand-name">galano<span>muebles</span></span>
    </a>
    <p class="nav-caption">GESTIÓN</p>
    <nav class="navigation" aria-label="Navegación principal">
      <button class="nav-link active" data-view="dashboard"><span class="nav-icon">⌂</span> Resumen</button>
      <button class="nav-link" data-view="productos"><span class="nav-icon">▤</span> Productos</button>
      <button class="nav-link" data-view="categorias"><span class="nav-icon">◈</span> Categorías</button>
      <button class="nav-link" data-view="clientes"><span class="nav-icon">♙</span> Clientes</button>
      <button class="nav-link" data-view="pedidos"><span class="nav-icon">▣</span> Pedidos</button>
      <button class="nav-link" data-view="detalles"><span class="nav-icon">☷</span> Detalles de pedido</button>
      <button class="nav-link" data-view="pagos"><span class="nav-icon">＄</span> Pagos</button>
    </nav>
    <div class="sidebar-footer">
      <span class="status-dot" id="connectionDot"></span>
      <span><strong id="connectionLabel">Conectando API...</strong><small>Servicio de administración</small></span>
      <button class="icon-button settings-button" id="settingsButton" type="button" aria-label="Configurar API" title="Configurar API">⚙</button>
    </div>
  </aside>

  <div class="mobile-backdrop" id="mobileBackdrop"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Abrir menú">☰</button>
      <div class="breadcrumb"><span>Galano Muebles</span><span class="breadcrumb-divider">/</span><strong id="breadcrumbCurrent">Resumen</strong></div>
      <div class="topbar-right"><span class="today-label" id="todayLabel"></span><span class="avatar">GM</span></div>
    </header>
    <section class="page-content" id="pageContent" aria-live="polite"></section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div><p class="eyebrow">GALANO MUEBLES</p><h2 id="modalTitle"></h2></div>
        <button class="icon-button" id="closeModal" type="button" aria-label="Cerrar">×</button>
      </div>
      <form id="recordForm">
        <div class="form-grid" id="formFields"></div>
        <div class="modal-actions"><button class="button button-quiet" id="cancelModal" type="button">Cancelar</button><button class="button button-primary" id="saveRecord" type="submit">Guardar</button></div>
      </form>
    </section>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
</body>
</html>
